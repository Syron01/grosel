[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperflux-studio"
version = "0.1.0"
description = "Bütçeli görsel model dönüştürme ve çıkarım yerleşim platformu"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142,<1",
  "uvicorn>=0.54,<1",
  "pydantic>=2.13,<3",
  "numpy>=2.5,<3",
  "Pillow>=12.3,<13",
  "torch>=2.11",
  "torchvision",
  "diffusers>=0.41,<0.42",
  "transformers>=5.17,<6",
  "huggingface-hub>=1.33,<2",
  "bitsandbytes>=0.50,<0.51",
  "clip @ git+https://github.com/openai/CLIP.git",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
include = ["web_app*"]
namespaces = true

[tool.setuptools.package-data]
web_app = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
